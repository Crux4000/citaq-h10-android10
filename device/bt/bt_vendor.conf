# Citaq H10-3 (PX5 Android 10): Wi-Fi/BT module AP6256 (Bluetooth BCM4345C5) or AP6255 (BCM4345C0), UART0.
# Bind-mounted over /vendor/etc/bluetooth by the boot hook (device/citaq-boot.sh, section 00b5), together with
# the .hcd firmware and a copy of the ROM's own rtkbt.conf. Installed by tools/install_data.py.
# No FwPatchFileName on purpose: the Bluetooth library asks the chip its name and loads the matching
# <name>.hcd from FwPatchFilePath ("AMPAK FW Auto detection ... Found patchfile" in logcat).
UartPort = /dev/ttyS0
FwPatchFilePath = /vendor/etc/bluetooth/
