# Citaq H10-3 (PX5 Android 10): AP6256 Bluetooth = BCM4345C5 on UART0.
# Bind-mounted over /vendor/etc/bluetooth by the boot hook (device/citaq-boot.sh, section 00b5),
# together with BCM4345C5.hcd and a copy of the ROM's own rtkbt.conf. Installed by tools/install_data.py.
UartPort = /dev/ttyS0
FwPatchFilePath = /vendor/etc/bluetooth/
FwPatchFileName = BCM4345C5.hcd
