name: Device report
description: Tried this port, or just ran the checks, on a terminal or another RK3368 device? Tell us how it went.
title: "[Device] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Every report goes into [docs/DEVICES.md](https://github.com/Crux4000/citaq-h10-android10/blob/main/docs/DEVICES.md).
        Failures and "I only ran the checks" are just as useful as successes.

        **Please don't post** serial numbers, IMEIs, MAC addresses or IP addresses. `ro.serialno` and `/proc/cmdline` contain the serial.

  - type: input
    id: device
    attributes:
      label: Device
      description: Brand and model, and where it came from if relevant (e.g. ex-Menulog, eBay TV box)
      placeholder: Citaq H10-3 (ex-Menulog)
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board marking
      description: What's printed on the main board, if you've opened it
      placeholder: CTE-RK3368-V1.0

  - type: dropdown
    id: progress
    attributes:
      label: How far did you get?
      options:
        - Only ran the getprop checks
        - Backed up the eMMC
        - firstlight booted (PX5 kernel to a busybox shell)
        - Android 10 booted from the recovery slot
        - Android 10 as the default boot, in daily use
        - Didn't boot / rolled back to stock
        - Ended up in maskrom
    validations:
      required: true

  - type: textarea
    id: getprop
    attributes:
      label: Stock firmware details
      description: |
        Run these over adb on the **stock** firmware and paste the output:
        ```
        adb shell getprop ro.board.platform
        adb shell getprop ro.product.model
        adb shell getprop ro.product.device
        adb shell getprop ro.build.type
        adb shell getprop ro.build.display.id
        adb shell cat /proc/partitions
        adb shell "ls -d /sys/bus/i2c/drivers/*/*-00*"
        adb shell "cat /sys/block/mmcblk*/device/name /sys/block/mmcblk*/device/manfid"
        ```
        The last two show which touch, sound and eMMC chips your board has. If you're already on Android 10, run them there instead.
      render: shell
    validations:
      required: true

  - type: textarea
    id: works
    attributes:
      label: What works on Android 10
      description: Skip this if you didn't get that far. Edit each line to ✅ works, ⚠️ partly, ❌ broken, or leave it as ❓ not tried / not fitted.
      value: |
        GPU acceleration: ❓
        Display: ❓
        Touch: ❓
        Wi-Fi: ❓
        Bluetooth: ❓
        Ethernet: ❓
        Sound: ❓
        USB host ports: ❓
        Receipt printer: ❓
        LEDs: ❓
        4G modem: ❓
        Google Play: ❓

  - type: textarea
    id: notes
    attributes:
      label: Problems, fixes and logs
      description: Anything that went wrong, anything you had to change, UART or dmesg snippets. Long logs are better as an attachment or a gist.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I've removed serial numbers, IMEIs, MAC addresses and IP addresses from everything above
          required: true
