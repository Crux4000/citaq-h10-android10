# /config/packages/kiosk.yaml  - Home Assistant package for the Citaq H10-3
# Receipt printer, LEDs and app relaunch over adb.
# Needs: the Android Debug Bridge integration pointed at the terminal (<ip>:5555), giving
# media_player.kiosk (rename to match yours), and /config/kiosk/kiosk_print.py (+ Pillow for images).
# Works on stock Android 5.1 and on the Android 10 port (citaq-boot.sh sets up ttyS1 + LED GPIOs).

input_text:
  kiosk_print_text:
    name: Kiosk print text
    max: 255
  kiosk_image_url:
    name: Kiosk image URL
    max: 255
  kiosk_qr_text:
    name: Kiosk QR text
    max: 255
  # Last printer check: "ok", or the problem ("out of paper", "lid open", ...). Set by the scripts.
  kiosk_printer_status:
    name: Kiosk printer status
    max: 100
  # Optional: a Companion app notify action (e.g. notify.mobile_app_kiosk) for printer error pop-ups
  # on the terminal's own screen. Leave empty for HA notifications only.
  kiosk_notify_target:
    name: Kiosk notify target
    max: 100

input_select:
  kiosk_print_size:
    name: Kiosk text size
    options: [normal, tall, wide, big]
  kiosk_print_align:
    name: Kiosk alignment
    options: [left, centre, right]
  kiosk_image:
    name: Kiosk image
    options: ["(press refresh)"]
  kiosk_led_pattern:
    name: Kiosk LED pattern
    options: ["off", solid, blink, alternate]
  kiosk_led_colour:
    name: Kiosk LED colour
    options: [red, blue, both]

input_boolean:
  kiosk_print_bold:
    name: Kiosk bold
  kiosk_print_cut:
    name: Kiosk cut after printing
    initial: true
  # The printer's own alarm (no paper / lid open). Off = silenced: every check and print job
  # re-sends "buzzer off", because each job's printer reset (ESC @) turns the buzzer back on.
  kiosk_printer_beeper:
    name: Kiosk printer beeper
    icon: mdi:volume-high

input_number:
  kiosk_qr_size:
    name: Kiosk QR size
    min: 2
    max: 16
    step: 1
    initial: 8
    mode: slider
  kiosk_led_speed:
    name: Kiosk LED speed
    min: 50
    max: 2000
    step: 50
    initial: 500
    unit_of_measurement: ms
    mode: slider
  kiosk_led_duration:
    name: Kiosk LED duration (0 = until stopped)
    min: 0
    max: 600
    step: 5
    initial: 0
    unit_of_measurement: s
    mode: box

shell_command:
  kiosk_build: >-
    python3 /config/kiosk/kiosk_print.py {{ mode }} {{ data | default('') | string | base64_encode }}
    --size {{ size | default('normal') }} --align {{ align | default('left') }}
    --bold {{ bold | default('off') }} --cut {{ cut | default('on') }}
    --qrsize {{ qrsize | default(8) | int }} --flip {{ flip | default('on') }}
    --beeper {{ beeper | default('off') }}
  kiosk_list_images: python3 /config/kiosk/kiosk_print.py list

script:
  # Core: build a job on HA, push it to the terminal, send it to the printer.
  # Call this from automations, e.g. mode: text, data: "Washing done!"
  kiosk_job:
    alias: Kiosk print job
    mode: queued
    fields:
      mode:
        description: text, image or qr
        example: text
      data:
        description: Text, QR content, or image (URL / file name in /media/kiosk)
      size:
        example: normal
      align:
        example: left
      bold:
        example: "off"
      cut:
        example: "on"
      qrsize:
        example: 8
      flip:
        description: "on (default) = reads the right way up from the front of the terminal"
        example: "on"
    sequence:
      - action: shell_command.kiosk_build
        data:
          mode: "{{ mode | default('text') }}"
          data: "{{ data | default('') }}"
          size: "{{ size | default('normal') }}"
          align: "{{ align | default('left') }}"
          bold: "{{ bold | default('off') }}"
          cut: "{{ cut | default('on') }}"
          qrsize: "{{ qrsize | default(8) | int }}"
          flip: "{{ flip | default('on') }}"
          beeper: "{{ states('input_boolean.kiosk_printer_beeper') }}"
        response_variable: build
        continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ build is not defined or build.returncode != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Kiosk print failed
              message: "{{ build.stderr if build is defined else 'build step failed - check the logs' }}"
          - stop: Print job failed
      # Upload to job_next.bin: a stalled job may still be reading job.bin.
      - action: androidtv.upload
        target:
          entity_id: media_player.kiosk
        data:
          local_path: /config/kiosk/job.bin
          device_path: /data/local/tmp/job_next.bin
      # One adb call: ask the printer for its status (DLE EOT 1-4, ~0.5 s), and only if it's
      # ready (lid shut, paper in, no error) send the job. The job is written by a detached cat
      # and watched via the UART's byte counter; if the printer stops taking data for 10 s
      # (paper ran out, lid opened) it returns "PRINT stalled" instead of hanging. The cat stays
      # behind and finishes the job once the printer is fixed (or kiosk_printer_cancel drops it).
      # Without root (no su) the byte counter can't be read, so it falls back to a plain cat.
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: >-
            S=/dev/ttyS1; T=/data/local/tmp; J=$T/job.bin;
            if [ -f $T/prn.pid ] && grep -q job.bin /proc/$(cat $T/prn.pid)/cmdline 2>/dev/null;
            then echo PRN busy; exit; fi;
            busybox stty -F $S 115200 raw -echo crtscts;
            timeout 0.1 cat $S > /dev/null 2>&1;
            (timeout 0.3 cat $S | od -An -tx1 > $T/prn_st) & sleep 0.1;
            (printf '{{ "\\037\\033\\037\\120\\102" if is_state("input_boolean.kiosk_printer_beeper", "off") else "" }}\020\004\001\020\004\002\020\004\003\020\004\004'
            > $S 2> /dev/null &); wait; st=$(cat $T/prn_st); echo "PRN $st"; set -- $st;
            [ $# -eq 4 ] && [ $((16#$2 & 16#24)) -eq 0 ] && [ $((16#$4 & 16#60)) -eq 0 ]
            && [ $((16#$3 & 16#68)) -eq 0 ] && [ $((16#$1 & 8)) -eq 0 ] || exit;
            mv -f $T/job_next.bin $J;
            tx() { su 0 sed -n 's/^1:.* tx:\([0-9]*\).*/\1/p' /proc/tty/driver/serial; };
            t0=$(tx); if [ -z "$t0" ]; then cat $J > $S; echo PRINT ok; exit; fi;
            P=0; [ -f $T/prn_dirty ] && P=9000;
            want=$((t0 + P + $(stat -c %s $J)));
            setsid sh -c "trap '' HUP; echo \$\$ > $T/prn.pid;
            { [ $P -gt 0 ] && head -c $P /dev/zero; cat $J; } > $S; rm -f $T/prn_dirty"
            > /dev/null 2>&1 < /dev/null &
            last=$t0; still=0; i=0;
            while [ $i -lt 1200 ]; do sleep 0.25; i=$((i+1)); t=$(tx);
            if [ "$t" -ge $want ]; then echo PRINT ok; exit; fi;
            if [ "$t" = "$last" ]; then still=$((still+1)); else still=0; last=$t; fi;
            if [ $still -ge 40 ]; then break; fi; done;
            echo "PRINT stalled $((t - t0)) of $((want - t0)) bytes"
        response_variable: sent
        continue_on_error: true
      - variables:
          sent_text: >-
            {{ sent['media_player.kiosk'].adb_response | default('', true)
               if sent is defined and sent and 'media_player.kiosk' in sent else '' }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ 'PRINT ok' in sent_text }}"
            sequence:
              - action: script.kiosk_printer_alert
                data:
                  problem: ""
          - conditions:
              - condition: template
                value_template: "{{ 'PRINT stalled' in sent_text }}"
            sequence:
              - action: script.kiosk_printer_alert
                data:
                  problem: "stuck mid-print (check the paper and lid)"
              - stop: Printer stopped mid-print
                error: true
        # Not printed (no paper, lid open, busy, no answer): ask again for the reason, which also
        # raises the alert. HA doesn't pass this stop on to a script that called kiosk_job, so a
        # multi-part receipt should check input_text.kiosk_printer_status between parts.
        default:
          - action: script.kiosk_printer_check
          - stop: Printer not ready, nothing printed
            error: true

  # Printer status, straight from the printer (ESC/POS DLE EOT 1-4, about 0.5 s). Returns
  # {ok, problem, warning, raw} and raises or clears the alert. Safe to call any time, e.g. from a
  # dashboard button or a time-pattern automation.
  #   raw bytes on a healthy printer: 16 12 12 12 · lid open: 1e 36 12 72 · no paper: 1e 32 12 72
  kiosk_printer_check:
    alias: Kiosk printer check
    mode: queued
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          # A print still waiting on the printer (stalled job) owns the port: report it, don't
          # query. Otherwise flush stale replies, send buzzer-off (if the beeper is off) and the
          # four status queries, and read the four reply bytes.
          command: >-
            S=/dev/ttyS1; T=/data/local/tmp;
            if [ -f $T/prn.pid ] && grep -q job.bin /proc/$(cat $T/prn.pid)/cmdline 2>/dev/null;
            then echo PRN busy; exit; fi;
            busybox stty -F $S 115200 raw -echo crtscts;
            timeout 0.1 cat $S > /dev/null 2>&1;
            (timeout 0.3 cat $S | od -An -tx1 > $T/prn_st) & sleep 0.1;
            (printf '{{ "\\037\\033\\037\\120\\102" if is_state("input_boolean.kiosk_printer_beeper", "off") else "" }}\020\004\001\020\004\002\020\004\003\020\004\004'
            > $S 2> /dev/null &); wait; echo "PRN $(cat $T/prn_st)"
        response_variable: adb
        continue_on_error: true
      - variables:
          raw: >-
            {%- set r = adb['media_player.kiosk'].adb_response | default('', true)
                if adb is defined and adb and 'media_player.kiosk' in adb else '' -%}
            {{- (r | regex_findall('PRN ([0-9a-z ]*)') | first | default('')) | trim -}}
          result: >-
            {%- set b = raw.split() -%}
            {%- set ns = namespace(problem='', warning='') -%}
            {%- if raw == 'busy' -%}
              {%- set ns.problem = 'stuck mid-print (check the paper and lid)' -%}
            {%- elif b | length < 4 -%}
              {%- set ns.problem = 'not responding' -%}
            {%- else -%}
              {%- set s1 = b[0] | int(0, 16) -%}{%- set s2 = b[1] | int(0, 16) -%}
              {%- set s3 = b[2] | int(0, 16) -%}{%- set s4 = b[3] | int(0, 16) -%}
              {%- if s2 | bitwise_and(4) -%}{%- set ns.problem = 'lid open' -%}
              {%- elif s4 | bitwise_and(96) or s2 | bitwise_and(32) -%}{%- set ns.problem = 'out of paper' -%}
              {%- elif s3 | bitwise_and(8) -%}{%- set ns.problem = 'cutter jammed' -%}
              {%- elif s3 | bitwise_and(96) -%}{%- set ns.problem = 'printer error (overheated?)' -%}
              {%- elif s1 | bitwise_and(8) -%}{%- set ns.problem = 'offline' -%}
              {%- endif -%}
              {%- if s4 | bitwise_and(12) -%}{%- set ns.warning = 'paper running low' -%}{%- endif -%}
            {%- endif -%}
            {{- {'ok': ns.problem == '', 'problem': ns.problem, 'warning': ns.warning, 'raw': raw} -}}
      - action: script.kiosk_printer_alert
        data:
          problem: "{{ result.problem }}"
          warning: "{{ result.warning }}"
      - stop: done
        response_variable: result

  # Raises (problem set) or clears (problem empty) the printer alert: HA notification, red LED
  # blinking until the next good print, and a pop-up on the terminal if kiosk_notify_target is set.
  kiosk_printer_alert:
    alias: Kiosk printer alert
    mode: queued
    fields:
      problem:
        example: out of paper
      warning:
        example: paper running low
    sequence:
      - variables:
          problem: "{{ problem | default('') }}"
          warning: "{{ warning | default('') }}"
          was: "{{ states('input_text.kiosk_printer_status') }}"
          target: "{{ states('input_text.kiosk_notify_target') | trim }}"
      - if:
          - condition: template
            value_template: "{{ problem != '' }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: kiosk_printer
              title: Kiosk printer
              message: "Printer: {{ problem }}. Nothing was printed."
          - action: script.kiosk_led
            data:
              pattern: blink
              colour: red
              speed: 400
          - if:
              - condition: template
                value_template: "{{ target.startswith('notify.') }}"
            then:
              - action: "{{ target }}"
                continue_on_error: true
                data:
                  title: Printer problem
                  message: "Printer: {{ problem }}"
                  data:
                    tag: kiosk_printer
                    channel: Printer
                    importance: high
                    priority: high
                    ttl: 0
                    sticky: "true"
                    notification_icon: mdi:printer-alert
        else:
          - if:
              - condition: template
                value_template: "{{ was not in ['ok', 'paper running low', '', 'unknown', 'unavailable'] }}"
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: kiosk_printer
              - action: script.kiosk_led
                data:
                  pattern: "off"
              - if:
                  - condition: template
                    value_template: "{{ target.startswith('notify.') }}"
                then:
                  - action: "{{ target }}"
                    continue_on_error: true
                    data:
                      message: clear_notification
                      data:
                        tag: kiosk_printer
          - if:
              - condition: template
                value_template: "{{ warning != '' and was != warning }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: kiosk_printer_paper
                  title: Kiosk printer
                  message: "The receipt paper is running low."
      - action: input_text.set_value
        target:
          entity_id: input_text.kiosk_printer_status
        data:
          value: "{{ problem or warning or 'ok' }}"

  # Drops a stalled print job (e.g. you don't want it any more). The next print first sends
  # 9000 blank bytes + a printer reset, to finish off any half-sent image cleanly.
  kiosk_printer_cancel:
    alias: Kiosk printer cancel stuck job
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: >-
            T=/data/local/tmp;
            if [ -f $T/prn.pid ] && grep -q job.bin /proc/$(cat $T/prn.pid)/cmdline 2>/dev/null;
            then kill -9 -- -$(cat $T/prn.pid); touch $T/prn_dirty; fi; rm -f $T/prn.pid
      - action: script.kiosk_printer_check

  kiosk_print_from_dashboard:
    alias: Kiosk print (dashboard text)
    sequence:
      - action: script.kiosk_job
        data:
          mode: text
          data: "{{ states('input_text.kiosk_print_text') }}"
          size: "{{ states('input_select.kiosk_print_size') }}"
          align: "{{ states('input_select.kiosk_print_align') }}"
          bold: "{{ states('input_boolean.kiosk_print_bold') }}"
          cut: "{{ states('input_boolean.kiosk_print_cut') }}"

  kiosk_print_test_page:
    alias: Kiosk test page
    sequence:
      - action: script.kiosk_job
        data:
          mode: text
          size: big
          align: centre
          bold: "on"
          cut: "off"
          data: "HOME ASSISTANT"
      - action: script.kiosk_job
        data:
          mode: text
          align: centre
          data: "{{ now().strftime('%A %d %B %Y  %H:%M') }}\\nKiosk printer is alive.\\n"

  kiosk_print_selected_image:
    alias: Kiosk print selected image
    sequence:
      - action: script.kiosk_job
        data:
          mode: image
          data: "{{ states('input_select.kiosk_image') }}"
          align: "{{ states('input_select.kiosk_print_align') }}"
          cut: "{{ states('input_boolean.kiosk_print_cut') }}"

  kiosk_print_image_url:
    alias: Kiosk print image from URL
    sequence:
      - action: script.kiosk_job
        data:
          mode: image
          data: "{{ states('input_text.kiosk_image_url') }}"
          align: "{{ states('input_select.kiosk_print_align') }}"
          cut: "{{ states('input_boolean.kiosk_print_cut') }}"

  kiosk_print_qr:
    alias: Kiosk print QR code
    sequence:
      - action: script.kiosk_job
        data:
          mode: qr
          data: "{{ states('input_text.kiosk_qr_text') }}"
          qrsize: "{{ states('input_number.kiosk_qr_size') | int }}"
          align: centre
          cut: "{{ states('input_boolean.kiosk_print_cut') }}"

  kiosk_refresh_images:
    alias: Kiosk refresh image list
    sequence:
      - action: shell_command.kiosk_list_images
        response_variable: listing
      - action: input_select.set_options
        target:
          entity_id: input_select.kiosk_image
        data:
          options: "{{ listing.stdout | from_json }}"

  kiosk_paper_feed:
    alias: Kiosk feed paper
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: "busybox printf '\\033d\\005' > /dev/ttyS1"

  kiosk_paper_cut:
    alias: Kiosk cut paper
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: "busybox printf '\\033d\\003\\035VB\\000' > /dev/ttyS1"

  # Printer alarm buzzer off (no paper / lid open). Citaq command 1F 1B 1F 50 42.
  # Lasts until the printer's next reset (every print job starts with one), so for "always off"
  # leave input_boolean.kiosk_printer_beeper off instead: the print scripts then re-send this.
  kiosk_buzzer_off:
    alias: Kiosk printer buzzer off
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: "printf '\\037\\033\\037\\120\\102' > /dev/ttyS1"

  kiosk_drawer_kick:
    alias: Kiosk cash drawer kick
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: "busybox printf '\\033p\\000\\200\\200' > /dev/ttyS1"

  # LEDs: red = gpio124, blue = gpio106 (1 = on). Plain on/off pins: no brightness control.
  # Patterns run on the terminal itself (a background loop started over adb), so flashing is
  # smooth at any speed and HA isn't tied up. Every call stops the previous pattern first.
  # Flashing patterns need the Android 10 port (setsid + fractional sleep); off/solid also work on stock 5.1.
  #   pattern:  off | solid | blink | alternate (red <-> blue)
  #   colour:   red | blue | both          (solid and blink)
  #   speed:    ms each light stays on/off (blink/alternate), min 50, default 500
  #   duration: seconds before it switches itself off, 0 = until the next call (blink/alternate)
  # Old calls with state: "on"/"off" still work (= solid / off).
  kiosk_led:
    alias: Kiosk LED
    mode: queued
    fields:
      pattern:
        example: blink
      colour:
        example: red
      speed:
        example: 500
      duration:
        example: 0
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: >-
            {%- set st = state | default('') | string | lower -%}
            {%- set pat = pattern | default('off' if st in ['off', 'false', '0'] else 'solid') | string | lower -%}
            {%- set col = colour | default('red') | string | lower -%}
            {%- set ms = [speed | default(500) | int(500), 50] | max -%}
            {%- set sec = '%.3f' | format(ms / 1000) -%}
            {%- set dur = [duration | default(0) | int(0), 0] | max -%}
            {%- set n = ((dur * 1000) / (2 * ms)) | round(0, 'ceil') | int if dur > 0 else 0 -%}
            {%- set r = 1 if col in ['red', 'both'] else 0 -%}
            {%- set b = 1 if col in ['blue', 'both'] else 0 -%}
            {%- set R = '/sys/class/gpio/gpio124/value' -%}
            {%- set B = '/sys/class/gpio/gpio106/value' -%}
            {%- set P = '/data/local/tmp/kiosk_led.pid' -%}
            [ -f {{ P }} ] && grep -q kiosk_led /proc/$(cat {{ P }})/cmdline 2>/dev/null && kill $(cat {{ P }}); rm -f {{ P }};
            {%- if pat in ['blink', 'alternate'] %}
            {%- set a1, b1, a2, b2 = (1, 0, 0, 1) if pat == 'alternate' else (r, b, 0, 0) %}
            setsid sh -c "trap '' HUP; echo \$\$ > {{ P }}; i=0;
            while [ {{ n }} -eq 0 ] || [ \$i -lt {{ n }} ]; do
            echo {{ a1 }} > {{ R }}; echo {{ b1 }} > {{ B }}; sleep {{ sec }};
            echo {{ a2 }} > {{ R }}; echo {{ b2 }} > {{ B }}; sleep {{ sec }};
            i=\$((i+1)); done; echo 0 > {{ R }}; echo 0 > {{ B }}; rm -f {{ P }}"
            > /dev/null 2>&1 < /dev/null &
            w=0; while [ ! -f {{ P }} ] && [ $w -lt 20 ]; do sleep 0.05; w=$((w+1)); done
            {%- elif pat == 'solid' %}
            echo {{ r }} > {{ R }}; echo {{ b }} > {{ B }}
            {%- else %}
            echo 0 > {{ R }}; echo 0 > {{ B }}
            {%- endif %}

  # Dashboard tester: set the four kiosk LED helpers, then run this.
  kiosk_led_from_dashboard:
    alias: Kiosk LED (dashboard settings)
    sequence:
      - action: script.kiosk_led
        data:
          pattern: "{{ states('input_select.kiosk_led_pattern') }}"
          colour: "{{ states('input_select.kiosk_led_colour') }}"
          speed: "{{ states('input_number.kiosk_led_speed') | int(500) }}"
          duration: "{{ states('input_number.kiosk_led_duration') | int(0) }}"

  # Screen (backlight) off / on. The car firmware's power manager ignores sleep requests, so
  # `input keyevent 223/224` do nothing on the Android 10 port. Instead this sets the backlight
  # brightness to 0, which blshim turns into a fully dark backlight, and "on" puts Android's
  # brightness setting back. Android keeps running underneath, so a touch on the dark screen
  # still taps the dashboard. Moving the brightness slider also turns the backlight back on.
  kiosk_screen:
    alias: Kiosk screen
    fields:
      "on":
        example: false
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: >-
            {%- set bl = '/sys/class/backlight/backlight/brightness' -%}
            {%- if on | default(true) | bool %}
            su 0 sh -c "echo $(settings get system screen_brightness) > {{ bl }}"
            {%- else %}
            su 0 sh -c "echo 0 > {{ bl }}"
            {%- endif %}

  kiosk_relaunch_app:
    alias: Kiosk relaunch HA app
    sequence:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          # (monkey aborts on the Android 10 port: "SYS_KEYS has no physical keys")
          command: >-
            am force-stop io.homeassistant.companion.android;
            am start -n io.homeassistant.companion.android/.launch.LaunchActivity

automation:
  # Beeper switch: off sends buzzer-off now, on resets the printer (ESC @), which turns it back on.
  # Also re-applied when the terminal comes back (the printer powers up with the beeper on).
  - id: kiosk_printer_beeper_apply
    alias: Kiosk printer beeper apply
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.kiosk_printer_beeper
      - trigger: state
        entity_id: media_player.kiosk
        from: unavailable
    actions:
      - delay: 2
      - action: androidtv.adb_command
        target:
          entity_id: media_player.kiosk
        data:
          command: >-
            {{ "printf '\\037\\033\\037\\120\\102' > /dev/ttyS1"
               if is_state('input_boolean.kiosk_printer_beeper', 'off')
               else "printf '\\033@' > /dev/ttyS1" }}

  # While the printer has a problem, look again every 30 s, so the alert (LED, pop-up,
  # notification) clears by itself once the paper is loaded or the lid is shut.
  - id: kiosk_printer_recheck
    alias: Kiosk printer recheck while in error
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_text.kiosk_printer_status
            state: ["ok", "paper running low", "", "unknown", "unavailable"]
    actions:
      - action: script.kiosk_printer_check

  - id: kiosk_refresh_images_on_start
    alias: Kiosk refresh image list on start
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: 30
      - action: script.kiosk_refresh_images
